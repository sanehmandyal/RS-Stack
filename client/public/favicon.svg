<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Red-Orange Fiery Gradient -->
    <linearGradient id="groworaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C2D12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Badge -->
  <circle cx="256" cy="256" r="236" fill="url(#groworaGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="6"/>

  <!-- Stylized Geometric "G" + Upward Surge Flame/Arrow -->
  <g fill="#FFFFFF" transform="translate(256, 256)">
    <!-- Arc of the letter G -->
    <path d="M 40,-120 A 135,135 0 1,0 135,30 L 135, -5 L 10,-5 L 10,40 L 85,40 A 85,85 0 1,1 25,-75 Z"/>
    
    <!-- Growth Rocket Arrow / Flame Surge pointing Upward -->
    <polygon points="120,-130 145,-45 80,-70"/>
    <polygon points="40,-130 120,-130 80,-70"/>
  </g>
</svg>
